[workspace]
resolver = "2"
members = [
    "batch-zkc",
    "crates/personas-bulletin",
    "crates/personas-cli",
    "crates/personas-client",
    "crates/personas-config",
    "crates/personas-core",
    "crates/personas-group-crypto",
    "crates/personas-messenger",
    "crates/personas-server",
    "crates/personas-wire",
    "crates/transports/signal-cli-client",
    "crates/transports/transport-api",
    "crates/transports/transport-mock",
    "crates/transports/transport-presage",
    "crates/transports/transport-signal-cli",
    "crates/transports/transport-slack",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# zk-promises (paper base library) and Nova folding — the rev pins are load-bearing:
# every crate must build against exactly these commits.
zk-callbacks = { git = "https://github.com/hkailad/callbacks.git", rev = "d6618793ce34cdb2fb987b1d6569f0f23f369d3e" }
folding-schemes = { git = "https://github.com/hkailad/sonobe", rev = "4d4fa08", package = "folding-schemes" }

# arkworks 0.5
ark-bn254 = { version = "0.5.0", features = ["r1cs"] }
ark-crypto-primitives = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-groth16 = "0.5.0"
ark-grumpkin = { version = "0.5.0", features = ["r1cs", "std"] }
ark-r1cs-std = "0.5.0"
ark-relations = "0.5.1"
ark-serialize = { version = "0.5.0", features = ["derive"] }
ark-snark = "0.5.1"
ark-std = "0.5.0"

# async / web
axum = { version = "0.8", features = ["json", "macros"] }
jsonrpsee = { version = "0.24", features = ["macros", "async-client", "http-client"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["limit"] }
bytes = "1"
futures-util = "0.3"
url = "2.5"

# serialization / CLI / errors / logging
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["cargo", "derive", "wrap_help"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }

# crypto / misc
base64 = "0.22"
blake2 = "0.10"
chrono = "0.4"
hex = "0.4"
lazy_static = "1.4"
rand = "0.8.5"
rand_chacha = "0.3"
sha2 = "0.10"

# persona rendering
badge-maker = "0.3.1"
petname = "2.0.2"
resvg = "0.46"

# signal — the modified in-process client (e2). presage (+ libsignal-service-rs +
# signalapp/libsignal, all AGPL-3.0-only) is git-only, pinned to the rev that built
# clean against the workspace nightly. Unlike the out-of-process signal-cli path
# (transport-signal-cli), this links libsignal in-process so the personas layer can
# control the sender-key state, the message key, and the sealed-sender call — the
# content-/delivery-layer anonymity modifications in docs/SERVERLESS_SIGNAL_DESIGN.md.
presage = { git = "https://github.com/whisperfish/presage", rev = "63482efd0cbdc0780baf0650517c7d55f1cac05d" }
# presage's only shipped Store backend (SQLite, bundled sqlcipher — no system sqlite
# needed). Used by the e2 A1 account-gated paths: the registered `Manager` persists its
# Signal protocol state (identity keys, sessions, prekeys) here. Same rev as presage.
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "63482efd0cbdc0780baf0650517c7d55f1cac05d" }
# signalapp/libsignal's protocol crate — the in-process Signal group cipher
# (group_encrypt/group_decrypt, sender-key state). Already in the lockfile via
# presage at this exact tag, so a direct dep re-resolves nothing. This is what the
# Phase A1 shared-sender-key content cipher (transport-presage) drives directly,
# rather than presage's account/network-oriented Manager (SERVERLESS_SIGNAL_DESIGN.md §4).
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.94.4" }

# slack
slack-morphism = { version = "2.14", features = ["hyper", "axum"] }
rsb_derive = "0.5"
dotenvy = "0.15"

# Force the ring backend for rustls (avoids the aws-lc-rs build dependency)
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-webpki = { version = "0.102", default-features = false, features = ["ring"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "tls12"] }

# signalapp/libsignal (pulled transitively by presage) expects its own
# curve25519-dalek fork; a dependent root must supply the same patch or the tree
# will not resolve. curve25519-dalek is not otherwise in this workspace, so the
# patch only activates once presage is in the graph (transport-presage).
[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }

# e2 A1 wiring — vendored, patchable mirror of libsignal-service-rs (the §8 "mirror
# in third_party/" step). presage pulls libsignal-service from this exact git rev; we
# override that source with the in-tree copy so the ServiceConfiguration repoint (point
# the client at our isolated self-hosted Signal-Server test-server, SERVERLESS_SIGNAL_DESIGN.md
# §8 / signal-server-selfhost-route) is an editable patch rather than a fork of a git dep.
# presage itself stays a plain git dep and transparently resolves against this copy.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { path = "third_party/libsignal-service-rs" }
