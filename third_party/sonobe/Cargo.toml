# Vendored, patchable copy of Sonobe's `folding-schemes` crate
# (fork github.com/hkailad/sonobe @ 4d4fa08727bed55821c787d51daf46a9a1f27ecd).
#
# This is a TRIMMED copy of the upstream workspace root manifest: only the
# `folding-schemes` member is vendored (solidity-verifiers, cli and
# experimental-frontends are not), and only the workspace dependencies that
# `folding-schemes` inherits are kept. The member's own manifest
# (`folding-schemes/Cargo.toml`) is unchanged, which is why `benches/` and the three
# `examples/` it names by `../` path are vendored beside it.
#
# The personas root workspace `exclude`s this directory and overrides the git source
# with `[patch."https://github.com/hkailad/sonobe"]`, so zk-callbacks and every
# personas crate resolve `folding-schemes` to this path. See VENDORED.md for the
# patch ledger and how to run this crate's own tests.
[workspace]
members = ["folding-schemes"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/privacy-scaling-explorations/sonobe/"

[workspace.dependencies]
criterion = { version = "0.5" }
getrandom = { version = "0.2" }
log = { version = "0.4" }
num-bigint = { version = "0.4.3" }
num-integer = { version = "0.1" }
pprof = { version = "0.13" }
sha3 = { version = "0.10" }
rand = { version = "0.8.5" }
rayon = { version = "1" }
thiserror = { version = "1.0" }

# Arkworks family
ark-bn254 = { version = "^0.5.0", default-features = false }
ark-crypto-primitives = { version = "^0.5.0", default-features = false }
ark-ec = { version = "^0.5.0", default-features = false }
ark-ff = { version = "^0.5.0", default-features = false }
ark-groth16 = { version = "^0.5.0" }
ark-grumpkin = { version = "^0.5.0", default-features = false }
ark-mnt4-298 = { version = "^0.5.0" }
ark-mnt6-298 = { version = "^0.5.0" }
ark-pallas = { version = "^0.5.0" }
ark-poly = { version = "^0.5.0", default-features = false }
ark-poly-commit = { version = "^0.5.0" }
ark-r1cs-std = { version = "^0.5.0", default-features = false }
ark-relations = { version = "^0.5.0", default-features = false }
ark-serialize = { version = "^0.5.0" }
ark-snark = { version = "^0.5.0", default-features = false }
ark-std = { version = "^0.5.0", default-features = false }
ark-vesta = { version = "^0.5.0" }
