# Browser-playable demo members + the :8443 gateway, run on the same host as the Signal
# backend (chat server :8080, storage-service :8090). See README.md.
#
#   cd deploy/play && docker compose up -d --build            # all five members
#   docker compose up -d gateway alice bob carol             # or a subset

x-member: &member
  image: personas-play
  build:
    context: ../..
    dockerfile: deploy/play/Dockerfile
  restart: unless-stopped
  shm_size: 1g          # Chromium renders through /dev/shm; Docker's 64 MB default crashes tabs
  mem_limit: 1600m
  volumes:
    # ONE keys dir for every member: all must prove against an identical key set. Nothing
    # else is shared through the filesystem: the phantom bundle and chain travel over
    # Signal, and members find each other through the directory service.
    - keys:/shared/keys
  # Members reach the backend through the gateway on the compose network, via a TLS relay
  # on their own 127.0.0.1 (entrypoint.sh) -- never through the public URL, which would
  # make libsignal-net select the production Signal network.
  depends_on: [gateway]
  environment: &member-env
    PERSONAS_UPSTREAM: ${PERSONAS_UPSTREAM:-gateway:8443}
    # Set by keys.sh: members then download the server's proving keys and verify them,
    # as installed clients do. Empty: alice generates a set the others share.
    PERSONAS_KEYS_SHA256: ${PERSONAS_KEYS_SHA256:-}
    PERSONAS_RESET: ${PERSONAS_RESET:-0}
    # Marks these members' directory entries PUBLIC (every tester sees alice, bob, ...).
    # Testers' own entries are visible only to their own household (directory.js).
    PERSONAS_DIRECTORY_PUBLIC_TOKEN: ${PERSONAS_DIRECTORY_PUBLIC_TOKEN:?add PERSONAS_DIRECTORY_PUBLIC_TOKEN to .env (see README)}

services:
  gateway:
    image: caddy:2
    restart: unless-stopped
    ports: ["0.0.0.0:8443:8443"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      PLAY_USER: ${PLAY_USER:-demo}
      PLAY_PASSWORD_HASH: ${PLAY_PASSWORD_HASH:?run ./set-password.sh first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./index.html:/srv/play/index.html:ro
      # Tester guide + Signal-Personas.dmg (publish-dmg.sh puts the .dmg here).
      - ./download:/srv/download:ro
      # The canonical proving keys (keys.sh), served at /personas/keys/.
      - keys:/srv/keys:ro

  # Member directory (directory.js): clients publish themselves and poll for each other.
  directory:
    image: node:24.17.0-bookworm-slim
    restart: unless-stopped
    command: ["node", "/srv/directory.js", "8080", "/data"]
    environment:
      DIRECTORY_PUBLIC_TOKEN: ${PERSONAS_DIRECTORY_PUBLIC_TOKEN:?add PERSONAS_DIRECTORY_PUBLIC_TOKEN to .env (see README)}
    volumes:
      - ./directory.js:/srv/directory.js:ro
      - directory:/data

  alice:
    <<: *member
    hostname: alice
    volumes: [keys:/shared/keys, alice:/home/member]
    # alice generates the shared proving keys; the others wait for them (entrypoint.sh).
    environment: { <<: *member-env, PERSONAS_INSTANCE: alice, PERSONAS_NUMBER: "+12025550001", PERSONAS_KEYGEN_LEADER: "1" }
  bob:
    <<: *member
    hostname: bob
    volumes: [keys:/shared/keys, bob:/home/member]
    environment: { <<: *member-env, PERSONAS_INSTANCE: bob, PERSONAS_NUMBER: "+12025550002" }
  carol:
    <<: *member
    hostname: carol
    volumes: [keys:/shared/keys, carol:/home/member]
    environment: { <<: *member-env, PERSONAS_INSTANCE: carol, PERSONAS_NUMBER: "+12025550003" }
  dave:
    <<: *member
    hostname: dave
    volumes: [keys:/shared/keys, dave:/home/member]
    environment: { <<: *member-env, PERSONAS_INSTANCE: dave, PERSONAS_NUMBER: "+12025550004" }
  erin:
    <<: *member
    hostname: erin
    volumes: [keys:/shared/keys, erin:/home/member]
    environment: { <<: *member-env, PERSONAS_INSTANCE: erin, PERSONAS_NUMBER: "+12025550005" }

  # The server-based implementation and the benchmarks, for comparing it with serverless on
  # this hardware (bench/README.md). Not part of the demo: profile `compare` keeps them out
  # of a plain `docker compose up` or `build`. Its chat is the in-process mock, its keys and
  # Privacy Pass issuer key its own, in the `validator` volume.
  validator:
    profiles: [compare]
    image: personas-validator
    build:
      context: ../..
      dockerfile: deploy/play/Dockerfile.validator
    restart: unless-stopped
    mem_limit: 3g
    working_dir: /data    # the server writes its timings to json_files/ here
    command: ["server"]
    environment:
      PERSONAS_CONFIG: /app/deploy/profiles/local.toml
      PERSONAS_BIND: 0.0.0.0:3000
      PERSONAS_DATA_DIR: /data
    volumes:
      - validator:/data
  bench:
    profiles: [compare]
    image: personas-validator
    entrypoint: ["personas-bench"]
    volumes:
      # Read-only: a benchmark must never be able to replace the group's proving keys.
      - keys:/shared/keys:ro
      - ./bench/results:/results

volumes:
  validator:
  directory:
  keys:
  alice:
  bob:
  carol:
  dave:
  erin:
