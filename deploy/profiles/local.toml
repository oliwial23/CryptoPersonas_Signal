# Local development: everything on localhost, both route families on the in-process mock
# transport. This is the profile a fresh checkout runs with — no credentials, no signal-cli
# daemon, no Slack workspace. Select it with `PERSONAS_PROFILE=local`.
#
# It is also the default even with no profile selected: every value here equals a built-in
# default. It exists so the matrix is legible in one place, and as the base to copy from.

mode = "service"

[log]
level = "info"

[server]
bind = "127.0.0.1:3000"
data_dir = "server/data"

[client]
api = "http://127.0.0.1:3000"
transport = "signal"

[transport]
# Force the mock even if credentials happen to be in the environment, so a local run can
# never post to a real messenger.
force_mock = true
